<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - SAEPChef</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <div class="login-card">

    <h2>LOGIN</h2>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="email"
        required
      >

      <input
        type="password"
        id="senha"
        placeholder="senha"
        required
      >

      <button type="submit">
        CONECTAR
      </button>

    </form>

  </div>

  <script src="./login.js"></script>

</body>

</html>
